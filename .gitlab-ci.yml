stages:
  - test

variables:
  BASE_URL: "https://eq-legal-collection-stage.bdengi.ru"

api-tests:
  stage: test
  image: node:18
  tags:
    - docker
  before_script:
    - npm ci
    - npx playwright install chromium
  script:
    - npm run typecheck:api
    # Для наборов API нужны masked/secrets variables: API_KEY/AUTH_TOKEN и service-specific base URLs.
    - npm run test:api -- --reporter=html,line --project=chromium
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week