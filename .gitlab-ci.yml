stages:
  - test

variables:
  BASE_URL: "https://eq-legal-collection-stage.bdengi.ru"

api-tests:
  stage: test
  image: node:18
  tags:
    - docker
  before_script:
    - npm ci
    - npx playwright install chromium
  script:
    # Путь исправлен: файл лежит в API-Tests/tests/... (а не API-Tests/eq-debt-collection/...)
    - npx playwright test API-Tests/tests/eq-debt-collection/packages/id/eq-debt-collection-packages-id.spec.ts --reporter=html,line --project=chromium
    # Для набора eq-legal-collection нужна masked-переменная API_KEY
    # - npx playwright test API-Tests/tests/eq-legal-collection --reporter=html,line --project=chromium
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week